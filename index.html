<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Nahiara 💙</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.container{
text-align:center;
max-width:700px;
padding:30px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:25px;
box-shadow:0 0 25px rgba(255,255,255,0.2);
}

h1{
font-size:3rem;
margin-bottom:20px;
}

p{
font-size:1.2rem;
line-height:1.8;
margin-bottom:20px;
}

button{
padding:15px 30px;
border:none;
border-radius:50px;
background:#60a5fa;
color:white;
font-size:1.1rem;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
background:#3b82f6;
}

#mensaje{
display:none;
margin-top:25px;
font-size:1.3rem;
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="container">

<h1>Para Nahiara 💙</h1>

<p>
Hay personas que llegan a nuestra vida y la hacen más bonita.
Tú eres una de ellas.
</p>

<button onclick="mostrarMensaje()">
Abrir mi mensaje 💌
</button>

<div id="mensaje">
✨ Nahiara, gracias por existir.<br><br>
Tu sonrisa ilumina los días más grises y tu forma de ser hace especial cada momento.<br><br>
Nunca olvides lo increíble que eres. 💙
</div>

</div>

<script>
function mostrarMensaje(){
const clave = prompt("Introduce la contraseña:");

if(clave === "Princesa"){
document.getElementById("mensaje").style.display = "block";
}else{
alert("Contraseña incorrecta 💙");
}
}
</script>

</body>
</html>
